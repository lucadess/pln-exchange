resources:
  jobs:
    pln_exchange_pipeline:
      name: pln-exchange-pipeline
      tasks:
        - task_key: extract_transform_load
          notebook_task:
            notebook_path: notebooks/01_pipeline
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              table_name: "{{job.parameters.table_name}}"
            source: GIT
          environment_key: Default
        - task_key: analyze
          depends_on:
            - task_key: extract_transform_load
          notebook_task:
            notebook_path: notebooks/02_visualize
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              table_name: "{{job.parameters.table_name}}"
            source: GIT
          environment_key: Default
        - task_key: visualize
          depends_on:
            - task_key: analyze
          notebook_task:
            notebook_path: notebooks/03_analyze
            base_parameters:
              catalog_name: "{{job.parameters.catalog_name}}"
              schema_name: "{{job.parameters.schema_name}}"
              table_name: "{{job.parameters.table_name}}"
            source: GIT
          environment_key: Default
      git_source:
        git_url: https://github.com/lucadess/pln-exchange.git
        git_provider: gitHub
        git_branch: feature/init
      queue:
        enabled: true
      parameters:
        - name: catalog_name
          default: falck_case
        - name: schema_name
          default: gold
        - name: table_name
          default: pln_exchange_rates
      environments:
        - environment_key: Default
          spec:
            environment_version: "2"
      performance_target: PERFORMANCE_OPTIMIZED
